<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAU Offseason Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #0d0f12;
  --surface:   #151920;
  --surface2:  #1c2330;
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.14);
  --accent:    #e8142a;
  --accent2:   #00e5a0;
  --text:      #f0f2f5;
  --muted:     #7a8494;
  --danger:    #ff4d4d;
  --font-head: 'Bebas Neue', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --r:         10px;
}
body { background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; min-height:100vh; line-height:1.5; }
.hidden { display:none !important; }

/* ── LOGIN ── */
#screen-login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; position:relative; overflow:hidden; }
.login-bg { position:absolute; inset:0; background: radial-gradient(ellipse 60% 50% at 80% 20%, rgba(232,20,42,0.10) 0%, transparent 60%), radial-gradient(ellipse 40% 60% at 10% 80%, rgba(232,20,42,0.05) 0%, transparent 60%); pointer-events:none; }
.login-box { width:100%; max-width:360px; position:relative; z-index:1; }
.login-shield { display:block; width:90px; height:90px; object-fit:contain; margin:0 auto 18px; filter:drop-shadow(0 0 18px rgba(232,20,42,0.35)); }
.login-logo { font-family:var(--font-head); font-size:48px; letter-spacing:2px; line-height:1; margin-bottom:3px; text-align:center; }
.login-logo .cau  { color:#e8142a; }
.login-logo .rest { color:#ffffff; }
.login-sub { color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:2rem; text-align:center; }
.field-group { margin-bottom:.85rem; }
.field-group label { display:block; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
.field-group input { width:100%; background:var(--surface2); border:1px solid var(--border2); border-radius:var(--r); padding:11px 13px; font-size:15px; font-family:var(--font-body); color:var(--text); outline:none; transition:border-color .2s; }
.field-group input:focus { border-color:var(--accent); }
.btn-primary { width:100%; background:var(--accent); color:#fff; border:none; border-radius:var(--r); padding:12px; font-size:14px; font-weight:600; font-family:var(--font-body); letter-spacing:.04em; cursor:pointer; transition:opacity .15s, transform .1s; margin-top:.4rem; }
.btn-primary:hover { opacity:.88; }
.btn-primary:active { transform:scale(.98); }
.btn-primary:disabled { opacity:.4; cursor:not-allowed; }
.error-msg { color:var(--danger); font-size:13px; margin-top:.65rem; text-align:center; min-height:18px; }

/* ── APP ── */
#screen-app { display:none; min-height:100vh; padding-bottom:5rem; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:.85rem 1.25rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(13,15,18,.93); backdrop-filter:blur(12px); z-index:10; }
.topbar-logo { font-family:var(--font-head); font-size:20px; letter-spacing:1px; }
.topbar-logo .cau  { color:#e8142a; }
.topbar-logo .rest { color:#ffffff; }
.topbar-right { display:flex; align-items:center; gap:10px; }
.player-badge { background:var(--surface2); border:1px solid var(--border2); border-radius:99px; padding:4px 12px 4px 8px; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; }
.avatar { width:24px; height:24px; background:var(--accent); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; }
.btn-logout { background:none; border:1px solid var(--border2); border-radius:8px; color:var(--muted); padding:5px 10px; font-size:12px; cursor:pointer; font-family:var(--font-body); }
.btn-logout:hover { color:var(--text); }
.content { padding:1.25rem 1.25rem; max-width:680px; margin:0 auto; }
.week-header { margin-bottom:1.25rem; }
.week-label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:.65rem; }
.semana-select { background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:7px 13px; color:var(--text); font-family:var(--font-body); font-size:13px; outline:none; cursor:pointer; margin-bottom:.85rem; min-width:220px; }
.semana-select:focus { border-color:var(--accent); }
.day-pills { display:flex; gap:7px; flex-wrap:wrap; }
.day-pill { background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:5px 14px; font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; color:var(--muted); font-family:var(--font-body); }
.day-pill:hover { border-color:rgba(232,20,42,.4); color:var(--text); }
.day-pill.active { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
.session-title { font-family:var(--font-head); font-size:30px; letter-spacing:1px; line-height:1; margin-bottom:.2rem; }
.session-meta { color:var(--muted); font-size:13px; margin-bottom:1.25rem; }
.phase-header { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:1.25rem 0 .65rem; display:flex; align-items:center; gap:8px; }
.phase-header::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── EXERCISE CARD ── */
.ex-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); margin-bottom:8px; overflow:hidden; }
.ex-header { display:flex; align-items:center; gap:10px; padding:11px 13px; }
.block-id { border-radius:6px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; border:1px solid transparent; }
.block-A { background:rgba(55,138,221,.18);  color:#5fb3f5; border-color:rgba(55,138,221,.35); }
.block-B { background:rgba(29,158,117,.18);  color:#3ecfa0; border-color:rgba(29,158,117,.35); }
.block-C { background:rgba(239,159,39,.18);  color:#ffc04d; border-color:rgba(239,159,39,.35); }
.block-D { background:rgba(127,119,221,.18); color:#a99ff5; border-color:rgba(127,119,221,.35); }
.block-E { background:rgba(212,83,126,.18);  color:#f07aaa; border-color:rgba(212,83,126,.35); }
.block-X { background:var(--surface2); color:var(--muted); border-color:var(--border2); }
.ex-card.super-A { border-left:3px solid rgba(55,138,221,.6); }
.ex-card.super-B { border-left:3px solid rgba(29,158,117,.6); }
.ex-card.super-C { border-left:3px solid rgba(239,159,39,.6); }
.ex-card.super-D { border-left:3px solid rgba(127,119,221,.6); }
.ex-card.super-E { border-left:3px solid rgba(212,83,126,.6); }
.ex-info { flex:1; min-width:0; }
.ex-name { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ex-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }

/* ── TAGS ── */
.tag { font-size:10px; padding:2px 7px; border-radius:4px; font-weight:500; }
.tag-squat   { background:rgba(55,138,221,.15);  color:#5fb3f5; }
.tag-hinge   { background:rgba(29,158,117,.15);  color:#3ecfa0; }
.tag-push    { background:rgba(239,159,39,.15);  color:#ffc04d; }
.tag-row     { background:rgba(127,119,221,.15); color:#a99ff5; }
.tag-pull    { background:rgba(99,153,34,.15);   color:#9acf44; }
.tag-plyo    { background:rgba(226,75,74,.15);   color:#ff7070; }
.tag-iso     { background:rgba(136,135,128,.15); color:#aaa; }
.tag-other   { background:rgba(212,83,126,.15);  color:#f07aaa; }
.tag-volume  { background:rgba(0,229,160,.10);  color:#00e5a0; border:1px solid rgba(0,229,160,.2); font-weight:600; }
.tag-method  { background:rgba(239,159,39,.10); color:#ffc04d; border:1px solid rgba(239,159,39,.2); }
.tag-notes   { background:rgba(100,160,255,.08); color:#7fb3ff; border:1px solid rgba(100,160,255,.18); font-style:italic; }

/* ── CARD ACTION BUTTONS ── */
.card-actions { display:flex; align-items:center; gap:5px; flex-shrink:0; }
.btn-card { flex-shrink:0; border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s; font-size:12px; }
.btn-hist { background:rgba(0,229,160,.10); border:1px solid rgba(0,229,160,.28); color:#00e5a0; }
.btn-hist:hover { background:rgba(0,229,160,.22); border-color:rgba(0,229,160,.55); transform:scale(1.05); }
.btn-hist:active { transform:scale(.95); }
.btn-load { background:rgba(239,159,39,.12); border:1px solid rgba(239,159,39,.35); color:#ffc04d; }
.btn-load:hover { background:rgba(239,159,39,.24); border-color:rgba(239,159,39,.6); transform:scale(1.05); }
.btn-load:active { transform:scale(.95); }
.btn-video { flex-shrink:0; border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s; font-size:12px; }
.btn-video.has-url { background:rgba(232,20,42,.12); border:1px solid rgba(232,20,42,.35); color:var(--accent); }
.btn-video.has-url:hover { background:rgba(232,20,42,.25); border-color:rgba(232,20,42,.6); transform:scale(1.05); }
.btn-video.has-url:active { transform:scale(.95); }
.btn-video.no-url { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); color:rgba(255,255,255,.2); cursor:default; pointer-events:none; }

/* ── INLINE PANELS ── */
.card-panel { border-top:1px solid var(--border); padding:10px 13px 11px; animation:slideDown .18s ease; }
@keyframes slideDown { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
.hist-title { font-size:10px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
.hist-empty { font-size:12px; color:var(--muted); font-style:italic; }
.hist-bar-wrap { margin-bottom:8px; }
.hist-bar-track { display:flex; gap:3px; align-items:flex-end; height:40px; margin-bottom:4px; }
.hist-bar { flex:1; border-radius:3px 3px 0 0; background:var(--accent2); opacity:.7; min-height:3px; position:relative; transition:opacity .15s; }
.hist-bar.current { opacity:1; background:var(--accent2); }
.hist-bar:hover { opacity:1; }
.hist-bar-labels { display:flex; gap:3px; }
.hist-bar-lbl { flex:1; font-size:9px; color:var(--muted); text-align:center; }
.hist-table { width:100%; border-collapse:collapse; font-size:11px; }
.hist-table td { padding:2px 4px; color:var(--muted); }
.hist-table td:first-child { color:var(--text); font-weight:500; }
.hist-table td:last-child { color:var(--accent2); font-weight:600; text-align:right; }
.hist-prev-lbl { font-size:10px; color:var(--muted); }
.hist-prev-val { font-size:13px; font-weight:700; color:var(--accent2); }
.hist-delta { font-size:10px; padding:1px 5px; border-radius:3px; }
.hist-delta.up   { background:rgba(0,229,160,.12); color:#00e5a0; }
.hist-delta.down { background:rgba(255,77,77,.12);  color:#ff7070; }
.hist-delta.eq   { background:rgba(255,255,255,.06); color:var(--muted); }
.load-display { flex:1; background:var(--surface); border:1px solid var(--border2); border-radius:7px; padding:5px 10px; font-family:var(--font-head); font-size:20px; letter-spacing:2px; color:var(--text); text-align:center; min-width:80px; }
.load-display.has-value { color:var(--accent2); }
.load-unit { font-size:11px; color:var(--muted); }
.load-numpad { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:8px; max-width:200px; }
.load-numpad .numpad-btn { padding:6px 2px; font-size:13px; }
.load-hint { font-size:10px; color:var(--muted); margin-top:4px; }
.btn-save-load { background:var(--accent2); color:#0d0f12; border:none; border-radius:8px; padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font-body); margin-top:8px; transition:opacity .15s; width:100%; }
.btn-save-load:hover { opacity:.85; }
.btn-save-load:disabled { opacity:.4; cursor:not-allowed; }
.load-saved-lbl { font-size:12px; color:var(--accent2); font-weight:600; padding:4px 0; }

/* ── COACH PANEL ── */
#coach-panel { display:none; }
#coach-panel.visible { display:block; }
.coach-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
.coach-title { font-family:var(--font-head); font-size:26px; letter-spacing:1px; }
.coach-badge { background:var(--accent); color:#fff; border-radius:5px; padding:2px 10px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.coach-sem-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:1rem; }
.kpi-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:10px 12px; text-align:center; }
.kpi-num { font-family:var(--font-head); font-size:28px; line-height:1; }
.kpi-num.green { color:var(--accent2); }
.kpi-num.amber { color:#ffc04d; }
.kpi-num.red   { color:var(--danger); }
.kpi-lbl { font-size:9px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-top:3px; }

/* ── TABLA EQUIPO ── */
.coach-table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin-bottom:1rem; }
.coach-table { width:100%; border-collapse:collapse; font-size:12px; }
.coach-table th { font-size:9px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding:7px 10px; border-bottom:1px solid var(--border); text-align:left; }
.coach-table td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
.coach-table tr:last-child td { border-bottom:none; }
.coach-table tr:hover td { background:rgba(255,255,255,.02); }
.status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
.dot-green { background:var(--accent2); box-shadow:0 0 5px rgba(0,229,160,.5); }
.dot-amber { background:#ffc04d; }
.dot-red   { background:var(--danger); }

/* ── CUADRADITOS DE SESIÓN ── */
.session-squares { display:flex; gap:3px; align-items:center; }
.sq {
  width:18px; height:18px;
  border-radius:3px;
  border:1px solid rgba(255,255,255,.15);
  display:flex; align-items:center; justify-content:center;
  font-size:8px; font-weight:700;
  position:relative;
  cursor:default;
  transition:transform .1s;
}
.sq:hover { transform:scale(1.15); }
.sq.sq-empty  { background:rgba(255,255,255,.05); color:rgba(255,255,255,.2); border-color:rgba(255,255,255,.08); }
.sq.sq-low    { background:rgba(0,229,160,.18);   color:#00e5a0; border-color:rgba(0,229,160,.4); }
.sq.sq-mid    { background:rgba(239,159,39,.18);  color:#ffc04d; border-color:rgba(239,159,39,.4); }
.sq.sq-high   { background:rgba(232,20,42,.18);   color:#ff7070; border-color:rgba(232,20,42,.4); }

/* ── RPE 7 DÍAS CHIP ── */
.rpe7-chip {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:32px; height:22px;
  border-radius:5px; font-size:11px; font-weight:700;
  padding:0 5px;
}
.rpe7-low  { background:rgba(0,229,160,.15);  color:#00e5a0; }
.rpe7-mid  { background:rgba(239,159,39,.15);  color:#ffc04d; }
.rpe7-high { background:rgba(232,20,42,.15);   color:#ff7070; }
.rpe7-none { background:rgba(255,255,255,.06); color:var(--muted); font-size:10px; }

/* ── RPE CHART POR SESIÓN ── */
.coach-rpe-chart { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px; margin-bottom:1rem; }
.coach-rpe-chart-title { font-size:10px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
.coach-rpe-chart-subtitle { font-size:12px; font-weight:600; color:var(--text); margin-bottom:12px; }

/* semanas — fila de columnas por semana */
.rpe-weeks-wrap { display:flex; flex-direction:column; gap:10px; }
.rpe-week-row { display:flex; align-items:flex-end; gap:4px; }
.rpe-week-label { font-size:9px; color:var(--muted); width:70px; flex-shrink:0; padding-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rpe-sessions-bars { display:flex; gap:4px; align-items:flex-end; flex:1; }
.rpe-session-col { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:28px; }
.rpe-bar-fill { width:100%; border-radius:3px 3px 0 0; min-height:3px; }
.rpe-bar-fill.rpe-low-bar  { background:rgba(0,229,160,.6); }
.rpe-bar-fill.rpe-mid-bar  { background:rgba(239,159,39,.6); }
.rpe-bar-fill.rpe-high-bar { background:rgba(232,20,42,.6); }
.rpe-bar-fill.current-week { opacity:1 !important; }
.rpe-bar-val  { font-size:9px; font-weight:700; }
.rpe-bar-val.rpe-low-val  { color:#00e5a0; }
.rpe-bar-val.rpe-mid-val  { color:#ffc04d; }
.rpe-bar-val.rpe-high-val { color:#ff7070; }
.rpe-bar-dia  { font-size:8px; color:var(--muted); }

/* ── SESSION PANEL ── */
.session-panel { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--r); padding:13px; margin-top:1.25rem; }
.panel-section { margin-bottom:14px; }
.panel-section:last-child { margin-bottom:0; }
.panel-title { font-size:12px; font-weight:600; color:var(--text); margin-bottom:1px; }
.panel-sub   { font-size:11px; color:var(--muted); margin-bottom:8px; }
.rpe-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:10px; }
.rpe-btn { background:var(--surface); border:1px solid var(--border2); border-radius:7px; padding:6px 2px; cursor:pointer; color:var(--muted); font-family:var(--font-body); transition:all .15s; text-align:center; display:flex; flex-direction:column; align-items:center; gap:1px; }
.rpe-btn .rpe-num  { font-size:15px; font-weight:700; line-height:1; }
.rpe-btn .rpe-desc { font-size:8px; line-height:1.2; }
.rpe-btn:hover { color:var(--text); border-color:rgba(232,20,42,.4); }
.rpe-btn.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
.time-display { background:var(--surface); border:1px solid var(--border2); border-radius:7px; padding:6px 12px; font-family:var(--font-head); font-size:22px; letter-spacing:2px; text-align:center; margin-bottom:6px; color:var(--text); }
.time-display.has-value { color:var(--accent2); }
.numpad { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-width:190px; margin:0 auto; }
.numpad-btn { background:var(--surface); border:1px solid var(--border2); border-radius:6px; padding:7px 2px; font-size:14px; font-family:var(--font-body); font-weight:500; color:var(--text); cursor:pointer; transition:all .12s; text-align:center; }
.numpad-btn:hover { background:rgba(255,255,255,.06); }
.numpad-btn:active { transform:scale(.93); }
.numpad-btn.del { color:var(--muted); font-size:12px; }
.numpad-hint { font-size:10px; color:var(--muted); text-align:center; margin-top:4px; }
.btn-save-session { width:100%; background:var(--accent); color:#fff; border:none; border-radius:var(--r); padding:11px; font-size:14px; font-weight:600; font-family:var(--font-body); letter-spacing:.04em; cursor:pointer; margin-top:13px; transition:opacity .15s; }
.btn-save-session:hover { opacity:.88; }
.btn-save-session:disabled { opacity:.4; cursor:not-allowed; }
.saved-msg { color:var(--accent2); font-size:14px; font-weight:600; text-align:center; padding:6px 0; }
.notes-banner { background:rgba(232,20,42,.05); border-left:2px solid var(--accent); border-radius:0 var(--r) var(--r) 0; padding:10px 14px; font-size:12px; color:var(--muted); line-height:1.65; margin-top:1rem; white-space:pre-line; }
.notes-banner strong { color:rgba(240,242,245,.7); display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; }

/* ── VIDEO MODAL ── */
.video-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.80); z-index:100; align-items:center; justify-content:center; padding:1rem; }
.video-modal-overlay.open { display:flex; }
.video-modal { width:100%; max-width:640px; background:var(--surface); border:1px solid var(--border2); border-radius:12px; overflow:hidden; }
.video-modal-header { display:flex; align-items:center; justify-content:space-between; padding:11px 15px; border-bottom:1px solid var(--border); }
.video-modal-title { font-size:13px; font-weight:600; color:var(--text); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.video-modal-close { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:0 4px; line-height:1; }
.video-modal-close:hover { color:var(--text); }
.video-wrap { position:relative; padding-bottom:56.25%; height:0; background:#000; }
.video-wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
.video-no-url { padding:2rem; text-align:center; color:var(--muted); font-size:13px; }

.loader { text-align:center; padding:3rem; color:var(--muted); font-size:13px; }
.spinner { width:26px; height:26px; border:2px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto .85rem; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty { text-align:center; padding:3rem 1rem; color:var(--muted); }
.empty-icon { font-size:32px; margin-bottom:.65rem; }
@media (max-width:500px) { .session-title { font-size:24px; } }
</style>
</head>
<body>

<!-- VIDEO MODAL -->
<div class="video-modal-overlay" id="video-modal-overlay" onclick="closeVideoModal(event)">
  <div class="video-modal">
    <div class="video-modal-header">
      <div class="video-modal-title" id="video-modal-title"></div>
      <button class="video-modal-close" onclick="closeVideoModal()">✕</button>
    </div>
    <div id="video-modal-body"></div>
  </div>
</div>

<!-- LOGIN -->

<!-- APP -->

  </div>
  <div class="content">

        <div class="kpi-card"><div class="kpi-num green" id="kpi-hoy">—</div><div class="kpi-lbl">Completaron</div></div>

        <div class="kpi-card"><div class="kpi-num red" id="kpi-sin">—</div><div class="kpi-lbl">Sin actividad</div></div>

        <table class="coach-table">
          <thead><tr>
            <th>Jugador</th>
            <th>RPE (últ. 7 días)</th>

        <div class="coach-rpe-chart-title">RPE por sesión</div>
        <div class="coach-rpe-chart-subtitle" id="coach-rpe-semana-label"></div>
        <div class="rpe-weeks-wrap" id="coach-rpe-weeks"></div>
      </div>
      <div style="height:1.25rem"></div>
      <div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;display:flex;align-items:center;gap:8px;">Vista sesión jugadores <span style="flex:1;height:1px;background:var(--border);display:inline-block"></span></div>
    </div>

    <!-- SELECTOR SEMANA + DÍAS -->
    <div class="week-header">
      <div class="week-label">Semana activa</div>
      <select id="sel-semana" class="semana-select" onchange="onSemanaChange()">
        <option value="1">Cargando...</option>
      </select>
      <div class="day-pills">
        <button class="day-pill active" onclick="selectDay(1,this)">Day 1</button>
        <button class="day-pill" onclick="selectDay(2,this)">Day 2</button>
        <button class="day-pill" onclick="selectDay(3,this)">Day 3</button>
        <button class="day-pill" onclick="selectDay(4,this)">Day 4</button>
        <button class="day-pill" onclick="selectDay(5,this)">Extra</button>
      </div>
    </div>
    <div id="session-container"></div>
  </div>
</div>

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVyC8AFCalPyYy116XmEtzdSMYUc2tzW2c_Tm_H_TcJSt-FGvUWjfnflDS-GukmqpX/exec';

let state = {
  user: null, dia: 1, semana: 1, semanas: [],
  rpeSession: null, tiempoSesion: '', guardado: false,
  isCoach: false,
  cards: {}
};

// ── API ───────────────────────────────────────────────────────
async function api(payload) {
  try {
    const url = APPS_SCRIPT_URL + '?payload=' + encodeURIComponent(JSON.stringify(payload));
    const r   = await fetch(url, { redirect: 'follow' });
    const txt = await r.text();
    try { return JSON.parse(txt); }
    catch { return { ok: false, error: 'Respuesta inesperada del servidor.' }; }
  } catch(err) {
    return { ok: false, error: 'Error de red: ' + err.message };
  }
}

// ── Nombre de semana actual ───────────────────────────────────
function getNombreSemana(idx) {
  // idx 1-based
  const sel = document.getElementById('sel-semana');
  if (!sel) return 'Semana ' + idx;
  const opt = sel.options[idx - 1];
  return opt ? opt.text : ('Semana ' + idx);
}

// ── LOGIN ─────────────────────────────────────────────────────
async function doLogin() {
  const btn   = document.getElementById('btn-login');
  const errEl = document.getElementById('login-error');
  const usuario  = document.getElementById('input-user').value.trim();
  const password = document.getElementById('input-pass').value;
  if (!usuario || !password) { errEl.textContent = 'Rellena usuario y contraseña'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...'; errEl.textContent = '';
  const res = await api({ action:'login', usuario, password });
  if (res.ok) {
    state.user = res;
    state.isCoach = (String(res.posicion||'').toLowerCase() === 'coach');
    document.getElementById('player-name').textContent = res.nombre;
    document.getElementById('avatar-initials').textContent =
      res.nombre.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-app').style.display   = 'block';
    if (state.isCoach) {
      document.getElementById('coach-topbar-badge').classList.remove('hidden');
      document.getElementById('coach-panel').classList.add('visible');
    }
    await loadSemanas();
    loadRutina();
    if (state.isCoach) loadCoachPanel();
  } else {
    errEl.textContent = res.error || 'Error al iniciar sesión';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}
document.getElementById('input-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ── SEMANAS ───────────────────────────────────────────────────
async function loadSemanas() {
  const res = await api({ action:'getSemanas' });
  const select = document.getElementById('sel-semana');
  if (res.ok && res.semanas && res.semanas.length) {
    state.semanas = res.semanas;
    select.innerHTML = res.semanas.map((s,i)=>`<option value="${i+1}">${s}</option>`).join('');
  } else {
    select.innerHTML = '<option value="1">Semana 1</option>';
  }
  state.semana = 1;
}
function onSemanaChange() {
  state.semana = parseInt(document.getElementById('sel-semana').value);
  resetSessionState(); loadRutina();
  if (state.isCoach) loadCoachPanel();
}
function selectDay(dia, btn) {
  state.dia = dia;
  resetSessionState();
  document.querySelectorAll('.day-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  loadRutina();
}
function resetSessionState() {
  state.rpeSession = null; state.tiempoSesion = ''; state.guardado = false; state.cards = {};
}

// ── RUTINA ────────────────────────────────────────────────────
async function loadRutina() {
  state.semana = parseInt(document.getElementById('sel-semana').value);
  const container = document.getElementById('session-container');
  container.innerHTML = '<div class="loader"><div class="spinner"></div>Cargando sesión...</div>';
  const res = await api({ action:'getRutina', semana:state.semana, dia:state.dia });
  if (!res.ok) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${res.error||'Error al cargar'}</div>`;
    return;
  }
  if (!res.ejercicios || !res.ejercicios.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>No hay ejercicios para este día todavía.</div>';
    return;
  }
  renderSession(res.ejercicios, res.nombreSemana || '', res.sessionNotes || '');
}

// ── HELPERS ───────────────────────────────────────────────────
const DAY_NAMES = ['','Lunes — Day 1','Martes — Day 2','Miércoles — Day 3','Jueves — Day 4','Sábado — Extra'];

const PATTERN_TAG = {
  Squat:'tag-squat', Hinge:'tag-hinge',
  Horizontal_push:'tag-push', Horizontal_row:'tag-row',
  Vertical_push:'tag-push',   Vertical_pull:'tag-pull',
  Plyo:'tag-plyo', Iso:'tag-iso',
  Olympics:'tag-other', Anti_rotation:'tag-other',
  Anti_extension:'tag-other', Reset:'tag-iso', Prep:'tag-iso',
  Lb_aux:'tag-iso', Up_aux:'tag-iso', Carry:'tag-other',
  Rotation:'tag-other'
};

function patternTag(p) { return PATTERN_TAG[p] || 'tag-iso'; }
function blockLetter(bloque) {
  if (!bloque) return 'X';
  const m = bloque.match(/^([A-Za-z]+)/);
  return m ? m[1].toUpperCase() : 'X';
}
function toEmbedUrl(url) {
  if (!url) return '';
  let id = '';
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtu.be')) {
      id = u.pathname.slice(1).split('?')[0];
    } else if (u.hostname.includes('youtube.com')) {
      id = u.searchParams.get('v') || '';
      if (!id && u.pathname.includes('/shorts/'))
        id = u.pathname.split('/shorts/')[1].split('/')[0];
    }
  } catch(_) {}
  return id ? `https://www.youtube.com/embed/${id}?autoplay=1` : '';
}

// ── RPE color helpers ──────────────────────────────────────────
function rpeClass(rpe) {
  if (rpe === null || rpe === undefined || isNaN(rpe)) return 'none';
  if (rpe <= 5) return 'low';
  if (rpe <= 7) return 'mid';
  return 'high';
}
function sqClass(rpe, guardada) {
  if (!guardada) return 'sq-empty';
  const c = rpeClass(rpe);
  return 'sq-' + c;
}

// ── VIDEO MODAL ───────────────────────────────────────────────
function openVideoModal(nombre, videoUrl) {
  const overlay = document.getElementById('video-modal-overlay');
  document.getElementById('video-modal-title').textContent = nombre;
  const embedUrl = toEmbedUrl(videoUrl);
  const body = document.getElementById('video-modal-body');
  if (embedUrl) {
    body.innerHTML = `<div class="video-wrap"><iframe src="${embedUrl}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>`;
  } else {
    body.innerHTML = `<div class="video-no-url">📹 Vídeo no disponible aún.<br><small>Añade la URL real en la columna VIDEO del Sheet.</small></div>`;
  }
  overlay.classList.add('open');
}
function closeVideoModal(e) {
  if (e && e.target !== document.getElementById('video-modal-overlay')) return;
  document.getElementById('video-modal-overlay').classList.remove('open');
  document.getElementById('video-modal-body').innerHTML = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeVideoModal(); });

// ── RENDER CARD ───────────────────────────────────────────────
function renderCard(e) {
  const letra   = blockLetter(e.bloque);
  const letraOk = ['A','B','C','D','E'].includes(letra) ? letra : 'X';
  const tagPatron = e.patron ? `<span class="tag ${patternTag(e.patron)}">${e.patron.replace(/_/g,' ')}</span>` : '';
  const tagSets  = e.sets         ? `<span class="tag tag-volume">${e.sets} sets</span>` : '';
  const tagReps  = e.reps         ? `<span class="tag tag-volume">${e.reps}</span>` : '';
  const tagContr = e.contraccion  ? `<span class="tag tag-method">${e.contraccion}</span>` : '';
  const tagTempo = e.tempo        ? `<span class="tag tag-method">⏱ ${e.tempo}</span>` : '';
  const tagLoad  = e.load_objetivo? `<span class="tag tag-method">${e.load_objetivo}</span>` : '';
  const tagNotas = e.notas        ? `<span class="tag tag-notes">📝 ${e.notas}</span>` : '';
  const tags = [tagPatron,tagSets,tagReps,tagContr,tagTempo,tagLoad,tagNotas].filter(Boolean).join('');
  const nombreEsc = e.ejercicio.replace(/'/g,"\\'");
  const videoEsc  = (e.video||'').replace(/'/g,"\\'");
  const hasVideo  = !!(e.video && e.video.startsWith('http'));
  const cardId    = (e.bloque+'_'+e.ejercicio).replace(/\W/g,'_');
  const hasLoadBtn = /(%|RPE|RIR)/i.test(e.load_objetivo||'');
  return `
  <div class="ex-card super-${letraOk}" id="card-${cardId}">
    <div class="ex-header">
      <div class="block-id block-${letraOk}">${e.bloque}</div>
      <div class="ex-info">
        <div class="ex-name">${e.ejercicio}</div>
        ${tags ? `<div class="ex-tags">${tags}</div>` : ''}
      </div>
      <div class="card-actions">
        <button class="btn-card btn-hist" title="Historial" onclick="toggleCardPanel('hist','${cardId}','${nombreEsc}')">⟳</button>
        ${hasLoadBtn ? `<button class="btn-card btn-load" title="Registrar carga" onclick="toggleCardPanel('load','${cardId}','${nombreEsc}')">＋</button>` : ''}
        <button class="btn-video ${hasVideo?'has-url':'no-url'}" onclick="openVideoModal('${nombreEsc}','${videoEsc}')" title="${hasVideo?'Ver vídeo':'Sin vídeo aún'}">▶</button>
      </div>
    </div>
    <div id="panel-hist-${cardId}" class="card-panel hidden"></div>
    <div id="panel-load-${cardId}" class="card-panel hidden"></div>
  </div>`;
}

// ── RENDER SESSION ────────────────────────────────────────────
function renderSession(ejercicios, nombreSemana, sessionNotes) {
  const container = document.getElementById('session-container');
  const prep = ejercicios.filter(e=>e.fase==='prep');
  const main = ejercicios.filter(e=>e.fase!=='prep');
  const semanaTxt = nombreSemana ||
    document.getElementById('sel-semana').options[
      document.getElementById('sel-semana').selectedIndex]?.text || '';
  const notesBanner = sessionNotes
    ? `<div class="notes-banner"><strong>📝 Notas de sesión</strong>${sessionNotes}</div>` : '';
  container.innerHTML = `
    <div class="session-title">${DAY_NAMES[state.dia]||'Sesión'}</div>
    <div class="session-meta">${semanaTxt}</div>
    ${prep.length ? `<div class="phase-header">Prep</div>${prep.map(renderCard).join('')}` : ''}
    <div class="phase-header">Main Block</div>
    ${main.map(renderCard).join('')}
    ${notesBanner}
    ${renderSessionPanel()}`;
}

// ── SESSION PANEL ─────────────────────────────────────────────
function renderSessionPanel() {
  if (state.guardado) {
    return `<div class="session-panel"><div class="saved-msg">✓ Sesión guardada — RPE ${state.rpeSession}${state.tiempoSesion?' · '+state.tiempoSesion+' min':''}</div></div>`;
  }
  const rpeData = [
    [1,'Reposo'],[2,'Muy fácil'],[3,'Ligero'],[4,'Cómodo'],
    [5,'Moderado'],[6,'Algo duro'],[7,'Duro'],[8,'Muy duro'],
    [9,'Casi máx'],[10,'Máximo']
  ];
  const rpeButtons = rpeData.map(([n,d])=>`
    <button class="rpe-btn${state.rpeSession===n?' sel':''}" onclick="selectRpe(${n},this)">
      <span class="rpe-num">${n}</span>
      <span class="rpe-desc">${d}</span>
    </button>`).join('');
  const tiempoTxt = state.tiempoSesion ? state.tiempoSesion+' min' : '—';
  const numpad = ['1','2','3','4','5','6','7','8','9','⌫','0',''].map(k=>{
    if (k==='') return '<div></div>';
    if (k==='⌫') return `<button class="numpad-btn del" onclick="numpadInput('del')">⌫</button>`;
    return `<button class="numpad-btn" onclick="numpadInput('${k}')">${k}</button>`;
  }).join('');
  return `
  <div class="session-panel" id="session-panel">
    <div class="panel-section">
      <div class="panel-title">¿Cómo fue la sesión?</div>
      <div class="panel-sub">RPE global — esfuerzo percibido (1–10)</div>
      <div class="rpe-grid">${rpeButtons}</div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Tiempo de sesión</div>
      <div class="panel-sub">Minutos totales</div>
      <div class="time-display${state.tiempoSesion?' has-value':''}" id="time-display">${tiempoTxt}</div>
      <div class="numpad">${numpad}</div>
      <div class="numpad-hint">minutos totales</div>
    </div>
    <button class="btn-save-session" id="btn-save-session"
            onclick="saveSession()" ${state.rpeSession!==null?'':'disabled'}>
      Guardar sesión
    </button>
  </div>`;
}

function selectRpe(val, btn) {
  state.rpeSession = val;
  document.querySelectorAll('.rpe-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  const s = document.getElementById('btn-save-session');
  if (s) s.disabled = false;
}
function numpadInput(key) {
  if (key==='del') state.tiempoSesion = state.tiempoSesion.slice(0,-1);
  else { if(state.tiempoSesion.length>=3) return; state.tiempoSesion += key; }
  const el = document.getElementById('time-display');
  if (!el) return;
  if (state.tiempoSesion) { el.textContent=state.tiempoSesion+' min'; el.classList.add('has-value'); }
  else { el.textContent='—'; el.classList.remove('has-value'); }
}
async function saveSession() {
  if (!state.rpeSession) return;
  const btn = document.getElementById('btn-save-session');
  if (btn) { btn.disabled=true; btn.textContent='Guardando...'; }
  const semanaNombre = getNombreSemana(state.semana);
  const res = await api({
    action:'saveRegistro', usuario:state.user.usuario,
    semana:state.semana, dia:state.dia,
    bloque:'SESION', ejercicio:'RPE_GLOBAL',
    carga_real:'', rpe:state.rpeSession, notas_jugador:'',
    tiempo_sesion: state.tiempoSesion ? parseInt(state.tiempoSesion) : ''
  });
  if (res.ok) {
    state.guardado = true;
    const panel = document.getElementById('session-panel');
    if (panel) panel.innerHTML = `<div class="saved-msg">✓ Sesión guardada — RPE ${state.rpeSession}${state.tiempoSesion?' · '+state.tiempoSesion+' min':''}</div>`;
  } else {
    if (btn) { btn.disabled=false; btn.textContent='Guardar sesión'; }
    alert('Error al guardar: '+(res.error||'inténtalo de nuevo'));
  }
}

// ── CARD PANEL TOGGLE ──────────────────────────────────────────
function toggleCardPanel(type, cardId, ejercicio) {
  const histEl = document.getElementById('panel-hist-'+cardId);
  const loadEl = document.getElementById('panel-load-'+cardId);
  const isOpen = type==='hist'
    ? !histEl.classList.contains('hidden')
    : !loadEl.classList.contains('hidden');
  histEl.classList.add('hidden');
  loadEl.classList.add('hidden');
  if (!isOpen) {
    if (type==='hist') {
      histEl.classList.remove('hidden');
      renderHistPanel(cardId, ejercicio, histEl);
    } else {
      loadEl.classList.remove('hidden');
      renderLoadPanel(cardId, ejercicio, loadEl);
    }
  }
}

// ── HISTORY PANEL ─────────────────────────────────────────────
async function renderHistPanel(cardId, ejercicio, el) {
  el.innerHTML = '<div class="hist-title">Cargando historial…</div>';
  const res = await api({ action:'getHistorial', usuario:state.user.usuario, ejercicio });
  if (!res.ok || !res.historial) {
    el.innerHTML = '<div class="hist-empty">No se pudo cargar el historial.</div>'; return;
  }
  const hist = res.historial
    .filter(h => h.carga && parseFloat(h.carga) > 0)
    .sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
  if (!hist.length) {
    el.innerHTML = `<div class="hist-title">Historial — ${ejercicio}</div><div class="hist-empty">Sin registros de carga aún.</div>`; return;
  }
  const maxCarga = Math.max(...hist.map(h=>parseFloat(h.carga)));
  const last = hist[hist.length-1];
  const prev = hist.length > 1 ? hist[hist.length-2] : null;
  const delta = prev ? (parseFloat(last.carga)-parseFloat(prev.carga)) : 0;
  const deltaClass = delta>0?'up':delta<0?'down':'eq';
  const deltaSign  = delta>0?'+':'';
  const bars = hist.map((h,i)=>{
    const pct = Math.round((parseFloat(h.carga)/maxCarga)*100);
    // use real week name from semanas array
    const semNom = (state.semanas && state.semanas[parseInt(h.semana)-1]) || ('S'+h.semana);
    return `<div class="hist-bar${i===hist.length-1?' current':''}" style="height:${pct}%" title="${semNom}: ${h.carga}kg"></div>`;
  }).join('');
  const lbls = hist.map(h=>{
    const semNom = (state.semanas && state.semanas[parseInt(h.semana)-1]) || ('S'+h.semana);
    // use short label: first word of week name
    const short = semNom.split('_')[0] || semNom;
    return `<div class="hist-bar-lbl" title="${semNom}">${short.length>6?short.slice(0,6)+'…':short}</div>`;
  }).join('');
  const rows = [...hist].reverse().slice(0,5).map(h=>{
    const semNom = (state.semanas && state.semanas[parseInt(h.semana)-1]) || ('Sem '+h.semana);
    return `<tr><td>${semNom}</td><td>${h.carga} kg</td><td>${h.rpe?'RPE '+h.rpe:'—'}</td></tr>`;
  }).join('');
  el.innerHTML = `
    <div class="hist-title">Historial — ${ejercicio}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:7px;">
      <div>
        <div class="hist-prev-lbl">Último registro</div>
        <div class="hist-prev-val">${last.carga} kg <span class="hist-delta ${deltaClass}">${deltaSign}${delta} kg</span></div>
      </div>
    </div>
    <div class="hist-bar-wrap">
      <div class="hist-bar-track">${bars}</div>
      <div class="hist-bar-labels">${lbls}</div>
    </div>
    <table class="hist-table"><tbody>${rows}</tbody></table>`;
}

// ── LOAD PANEL ─────────────────────────────────────────────────
function renderLoadPanel(cardId, ejercicio, el) {
  if (!state.cards[cardId]) state.cards[cardId] = { loadVal:'', loadSaved:false };
  const cs = state.cards[cardId];
  if (cs.loadSaved) {
    el.innerHTML = `<div class="load-saved-lbl">✓ Carga guardada — ${cs.loadVal} kg</div>`; return;
  }
  el.innerHTML = `
    <div class="hist-title">Registrar carga — ${ejercicio}</div>
    <div class="load-display${cs.loadVal?' has-value':''}" id="ld-disp-${cardId}">${cs.loadVal||'—'}</div>
    <div class="load-unit">kg</div>
    <div class="load-numpad">
      ${['1','2','3','4','5','6','7','8','9','⌫','0',''].map(k=>{
        if(k==='') return '<div></div>';
        if(k==='⌫') return `<button class="numpad-btn del" onclick="loadNumpad('${cardId}','del')">⌫</button>`;
        return `<button class="numpad-btn" onclick="loadNumpad('${cardId}','${k}')">${k}</button>`;
      }).join('')}
    </div>
    <div class="load-hint">Introduce el peso en kg</div>
    <button class="btn-save-load" onclick="saveLoad('${cardId}','${ejercicio.replace(/'/g,"\\'")}')">Guardar carga</button>`;
}
function loadNumpad(cardId, key) {
  if (!state.cards[cardId]) state.cards[cardId] = { loadVal:'', loadSaved:false };
  const cs = state.cards[cardId];
  if (key==='del') cs.loadVal = cs.loadVal.slice(0,-1);
  else { if(cs.loadVal.length>=5) return; cs.loadVal += key; }
  const disp = document.getElementById('ld-disp-'+cardId);
  if (disp) { disp.textContent=cs.loadVal||'—'; disp.classList.toggle('has-value',!!cs.loadVal); }
}
async function saveLoad(cardId, ejercicio) {
  const cs = state.cards[cardId];
  if (!cs || !cs.loadVal) return;
  const btn = document.getElementById('btn-sv-load-'+cardId) || document.querySelector(`#panel-load-${cardId} .btn-save-load`);
  if (btn) { btn.disabled=true; btn.textContent='Guardando…'; }
  const res = await api({
    action:'saveRegistro', usuario:state.user.usuario,
    semana:state.semana, dia:state.dia,
    bloque: cardId.split('_')[0], ejercicio,
    carga_real: cs.loadVal, rpe:'', notas_jugador:'', tiempo_sesion:''
  });
  if (res.ok) {
    cs.loadSaved = true;
    const el = document.getElementById('panel-load-'+cardId);
    if (el) el.innerHTML = `<div class="load-saved-lbl">✓ Carga guardada — ${cs.loadVal} kg</div>`;
  } else {
    if (btn) { btn.disabled=false; btn.textContent='Guardar carga'; }
    alert('Error al guardar: '+(res.error||'inténtalo de nuevo'));
  }
}

// ── COACH PANEL ───────────────────────────────────────────────
async function loadCoachPanel() {
  const semanaIdx = state.semana - 1;
  const semanaNombre = (state.semanas && state.semanas[semanaIdx]) || ('Semana ' + state.semana);
  document.getElementById('coach-sem-label').textContent = semanaNombre;

  const res = await api({ action:'getEquipo', semana: state.semana });
  if (!res.ok) return;

  const equipo = res.equipo;
  const nombreSemana = res.nombreSemana || semanaNombre;

  // KPIs
  const total  = equipo.length;
  const complet = equipo.filter(j=>j.estado==='guardada').length;
  const pend   = equipo.filter(j=>j.estado==='pendiente').length;
  const inact  = equipo.filter(j=>j.estado==='inactivo').length;
  document.getElementById('kpi-total').textContent = total;
  document.getElementById('kpi-hoy').textContent   = complet;
  document.getElementById('kpi-pend').textContent  = pend;
  document.getElementById('kpi-sin').textContent   = inact;

  // Cabecera columna sesiones con nombre real
  document.getElementById('th-sesiones').textContent = 'RPE ' + nombreSemana;

  // Tabla jugadores
  const tbody = document.getElementById('coach-tbody');
  tbody.innerHTML = equipo.map(j => {
    const dotCls = j.estado==='guardada' ? 'dot-green' : j.estado==='pendiente' ? 'dot-amber' : 'dot-red';

    // RPE últimos 7 días
    let rpe7Html = '<span class="rpe7-chip rpe7-none">—</span>';
    if (j.rpe7dias !== null && j.rpe7dias !== undefined) {
      const c = rpeClass(j.rpe7dias);
      rpe7Html = `<span class="rpe7-chip rpe7-${c}">${j.rpe7dias}</span>`;
    }

    // Cuadraditos de sesión con RPE semáforo
    const squares = (j.sesionesDetalle || []).map(s => {
      const cls = sqClass(s.rpe, s.guardada);
      const rpeLabel = s.guardada && s.rpe ? Math.round(s.rpe) : '';
      return `<div class="sq ${cls}" title="Day ${s.dia}${s.guardada?' · RPE '+s.rpe:' · pendiente'}">${rpeLabel}</div>`;
    }).join('');

    return `<tr>
      <td><span class="status-dot ${dotCls}"></span>${j.nombre}</td>
      <td>${rpe7Html}</td>
      <td><div class="session-squares">${squares}</div></td>
      <td>${j.tiempo ? j.tiempo+' min' : '—'}</td>
    </tr>`;
  }).join('');

  // Gráfico RPE por sesión
  if (res.rpeChart && res.rpeChart.length) {
    const semanaActual = String(state.semana);
    // Altura máxima para escalar barras
    const allRpes = res.rpeChart.flatMap(s => s.sesiones.map(ss => ss.rpeMedia));
    const maxRpe  = allRpes.length ? Math.max(...allRpes) : 10;

    const weeksHtml = res.rpeChart.map(sem => {
      const isCurrent = sem.semana === semanaActual;
      const sesionesHtml = sem.sesiones.map(ss => {
        const c = rpeClass(ss.rpeMedia);
        const pct = Math.round((ss.rpeMedia / maxRpe) * 44); // max 44px
        return `<div class="rpe-session-col">
          <div class="rpe-bar-val rpe-${c}-val">${ss.rpeMedia}</div>
          <div class="rpe-bar-fill rpe-${c}-bar${isCurrent?' current-week':''}" style="height:${Math.max(pct,3)}px"></div>
          <div class="rpe-bar-dia">D${ss.dia}</div>
        </div>`;
      }).join('');

      // Media total semana
      const mediaTxt = sem.rpeMedia ? ` · media ${sem.rpeMedia}` : '';

      return `<div class="rpe-week-row">
        <div class="rpe-week-label" title="${sem.nombreSemana}">${sem.nombreSemana}${mediaTxt}</div>
        <div class="rpe-sessions-bars">${sesionesHtml}</div>
      </div>`;
    }).join('');

    document.getElementById('coach-rpe-semana-label').textContent = nombreSemana;
    document.getElementById('coach-rpe-weeks').innerHTML = weeksHtml;
    document.getElementById('coach-rpe-chart').style.display = 'block';
  }
}

function logout() {
  state = {user:null,dia:1,semana:1,semanas:[],rpeSession:null,tiempoSesion:'',guardado:false,isCoach:false,cards:{}};
  document.getElementById('screen-app').style.display   = 'none';
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('coach-panel').classList.remove('visible');
  document.getElementById('coach-topbar-badge').classList.add('hidden');
  document.getElementById('input-user').value = '';
  document.getElementById('input-pass').value = '';
  const btn = document.getElementById('btn-login');
  btn.disabled=false; btn.textContent='Entrar';
  document.getElementById('login-error').textContent='';
}
